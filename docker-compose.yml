services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: customer_api
    working_dir: /var/www
    volumes:
      - ./api:/var/www
    networks:
      - customer_network
    depends_on:
      - database
      - searcher

  nginx:
    image: nginx:alpine
    container_name: customer_nginx
    ports:
      - "8080:80"
    volumes:
      - ./api:/var/www
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - customer_network
    depends_on:
      - api

  database:
    image: mysql:8.0
    container_name: customer_db
    environment:
      MYSQL_DATABASE: customer_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: password
      MYSQL_USER: customer_user
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - customer_network

  searcher:
    image: elasticsearch:8.12.0
    container_name: customer_es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - customer_network

networks:
  customer_network:
    driver: bridge

volumes:
  db_data:
  es_data: